  var EXPORT_MODE      = false;
  var SECONDARY_COUNTS = {"Health": 2, "Park": 3, "Playground": 1, "Supermarket": 1};

  var PILL_ORDER = [
    'Supermarket', 'Park', 'Playground',
    'Bakery & Food', 'Restaurant', 'Market',
    'Transit', 'Bike Share', 'Health',
  ];

  // ── Load POIs ───────────────────────────────────────────────────────────
  function loadPOIs() {
    var features = (GEOJSON && GEOJSON.features) ? GEOJSON.features : [];
    if (!features.length) return;

    if (EXPORT_MODE) {
      // Keep primary POIs only, top 2 per category by score for a clean export
      var perCat = {};
      features = features
        .filter(function(f) { return f.properties.status !== 'secondary'; })
        .sort(function(a, b) { return (b.properties.score || 0) - (a.properties.score || 0); })
        .filter(function(f) {
          var cat = f.properties.category || '?';
          perCat[cat] = (perCat[cat] || 0) + 1;
          return perCat[cat] <= 2;
        });
    }

    LQ.poiLayer = L.layerGroup();
    features.forEach(function(f) {
      if (!f.geometry || !f.geometry.coordinates) return;
      if (f.properties && f.properties.status === 'secondary') {
        LQ.secondaryMarkers.push(LQ.makePOIMarker(f));
        return;
      }
      var m = LQ.makePOIMarker(f);
      var cat = (f.properties && f.properties.category) || '';
      if (cat) (LQ.catMarkers[cat] = LQ.catMarkers[cat] || []).push(m);
      if (!EXPORT_MODE && !LQ.DEFAULT_CATS[cat]) {
        LQ.hiddenCats[cat] = true;
      } else {
        m.addTo(LQ.poiLayer);
      }
    });
    LQ.poiLayer.addTo(LQ.map);
  }

  window.lqCopyShareUrl = function() {
    navigator.clipboard.writeText(SHARE_URL).then(function() {
      var msg = document.getElementById('share-copied-msg');
      if (!msg) return;
      msg.style.display = '';
      setTimeout(function() { msg.style.display = 'none'; }, 2000);
    }).catch(function() {
      prompt('Copy this link:', SHARE_URL);
    });
  };

  document.addEventListener('DOMContentLoaded', function() {
    LQ.initMap({});
    LQ.map.fitBounds(L.latLng(LAT, LON).toBounds(600));
    if (EXPORT_MODE) { LQ.map.setZoom(LQ.map.getZoom() + 2); }
    document.getElementById('map').classList.add('map-active');

    if (!EXPORT_MODE && window.innerWidth <= 768) {
      LQ.map.panBy([0, -Math.round(window.innerHeight * 0.16)], { animate: false });
    }

    LQ.drawRings(LAT, LON);
    LQ.placeRentalMarker(LAT, LON);
    loadPOIs();

    // Wire category pills
    var pillContainer = document.getElementById('cat-pills-container');
    if (pillContainer) {
      var pillEls = Array.from(pillContainer.querySelectorAll('.cat-pill'));
      var bycat = {};
      pillEls.forEach(function(el) { bycat[el.dataset.cat] = el; });
      var DEFAULT_ON = ['Bakery & Food', 'Supermarket', 'Park', 'Playground'];
      var extraCats = pillEls.map(function(el) { return el.dataset.cat; })
        .filter(function(c) { return PILL_ORDER.indexOf(c) < 0; });
      DEFAULT_ON
        .concat(PILL_ORDER.filter(function(c) { return DEFAULT_ON.indexOf(c) < 0; }))
        .concat(extraCats)
        .forEach(function(cat) {
          if (bycat[cat]) pillContainer.appendChild(bycat[cat]);
        });
      pillEls.forEach(function(el) {
        if (LQ.hiddenCats[el.dataset.cat]) el.style.opacity = '0.45';
        el.onclick = function() { _toggleCat(el.dataset.cat); };
      });
      if (LQ.secondaryMarkers.length) {
        var link = document.createElement('a');
        link.id = 'show-more-link';
        link.href = '#';
        link.textContent = 'Show more…';
        link.style.cssText = 'font-size:0.78rem;color:var(--text-muted);text-decoration:underline;align-self:center;white-space:nowrap;';
        link.onclick = function(e) { e.preventDefault(); _toggleSecondary(); };
        pillContainer.appendChild(link);
      }
    }
  });

  function _toggleCat(cat) {
    LQ.toggleCat(cat);
    var pillContainer = document.getElementById('cat-pills-container');
    if (pillContainer) {
      var el = pillContainer.querySelector('[data-cat="' + cat + '"]');
      if (el) el.style.opacity = LQ.hiddenCats[cat] ? '0.45' : '1';
    }
  }

  function _toggleSecondary() {
    var isNowVisible = LQ.toggleSecondary();
    var link = document.getElementById('show-more-link');
    if (link) link.textContent = isNowVisible ? 'Show less…' : 'Show more…';
    document.querySelectorAll('#cat-pills-container .cat-pill[data-primary-count]').forEach(function(el) {
      var base  = parseInt(el.dataset.primaryCount, 10);
      var delta = SECONDARY_COUNTS[el.dataset.cat] || 0;
      var span  = el.querySelector('.pill-count');
      if (span) span.textContent = base + (isNowVisible ? delta : 0);
    });
  }
})();
</script>
