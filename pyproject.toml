[project]
name = "lequartier-web"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "werkzeug>=3.0",
    "gunicorn>=23.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "overpass>=0.7",
    "rich>=13.0",
    "tqdm>=4.66",
    "staticmap>=0.5",
    "stripe>=8.0",
    "qrcode[pil]>=7.0",
]

[project.scripts]
lequartier-web = "src.web.app:run_prod"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = []
