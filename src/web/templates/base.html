<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Le Quartier{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
  <meta name="description" content="Generate a neighbourhood map for any rental listing — supermarkets, parks, transit, restaurants and more.">

  <!-- Open Graph -->
  <meta property="og:title" content="{% block og_title %}Le Quartier{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Generate a neighbourhood map for any rental listing — supermarkets, parks, transit, restaurants and more.{% endblock %}">
  <meta property="og:image" content="{% block og_image %}https://maps.girard-davila.net/images/map-previews/lamai.png{% endblock %}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{% block og_url %}https://lequartier.girard-davila.net/{% endblock %}">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="">
  <script src="{{ url_for('static', filename='js/htmx.min.js') }}"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <!-- Google Analytics -->
  {% if ga_measurement_id %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ ga_measurement_id }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ ga_measurement_id }}');
  </script>
  {% endif %}
</head>
<body>
  <div id="map"></div>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <a href="https://lequartier.girard-davila.net/map" class="footer-label" style="text-decoration:none;">Le Quartier</a>
    {% if debug_mode and commit_short %}
    <span class="footer-sep">·</span>
    <a href="{{ github_commit_url }}" target="_blank" rel="noopener" class="footer-commit">{{ commit_short }}</a>
    <span class="footer-sep">·</span>
    <a href="/cache">⚡ cache</a>
    {% endif %}
  </footer>

  {% block extra_js %}{% endblock %}
</body>
</html>
