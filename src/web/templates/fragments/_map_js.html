<script type="application/json" id="geojson-data">{{ geojson_json | safe }}</script>
<script>
(function () {
  const RAW_GEOJSON  = JSON.parse(document.getElementById('geojson-data').textContent);
  const CENTER_LAT   = {{ lat }};
  const CENTER_LON   = {{ lon }};
  const AIRBNB_URL   = {{ airbnb_url | tojson }};
  const LISTING_ID   = {{ listing_id | tojson }};
  const READONLY     = {{ 'true' if readonly else 'false' }};
  const CONFIDENCE   = {{ confidence | tojson }};

  document.getElementById('map').classList.add('map-active');

  const notifyInput = document.getElementById('notify-listing-id');
  if (notifyInput) notifyInput.value = LISTING_ID;

  const existingMap = window._wizardMap;
  let map;
  if (existingMap) {
    map = existingMap;
    map.setView([CENTER_LAT, CENTER_LON], 16);
    (window._loadingLayers || []).forEach(l => { try { map.removeLayer(l); } catch(e){} });
    window._loadingLayers = [];
  } else {
    map = L.map('map').setView([CENTER_LAT, CENTER_LON], 16);
    window._wizardMap = map;
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 19,
    }).addTo(map);
  }

  const homeIcon = L.divIcon({
    html: '<div class="map-pin map-pin-home">🏠</div>',
    className: '',
    iconSize: [32, 32],
    iconAnchor: [16, 16],
  });
  const homeMarker = L.marker([CENTER_LAT, CENTER_LON], { icon: homeIcon })
    .bindPopup('<strong>Airbnb listing</strong><br><a href="' + AIRBNB_URL + '" target="_blank">View listing ↗</a>')
    .addTo(map);

  const uncertaintyRadius = CONFIDENCE === 'high' ? 80 : 220;
  L.circle([CENTER_LAT, CENTER_LON], {
    radius: uncertaintyRadius,
    color: '#f97316', weight: 1, opacity: 0.9,
    fillColor: '#f97316', fillOpacity: 0.12, interactive: false,
  }).addTo(map);

  [
    { r: 1200, fillOpacity: 0.03 },
    { r: 800,  fillOpacity: 0.05 },
    { r: 400,  fillOpacity: 0.09 },
  ].forEach(function(c) {
    L.circle([CENTER_LAT, CENTER_LON], {
      radius: c.r,
      color: '#1a6b3c', weight: 1, opacity: 0.4,
      fillColor: '#1a6b3c', fillOpacity: c.fillOpacity, interactive: false,
    }).addTo(map);
  });

  const legend = L.control({ position: 'bottomright' });
  legend.onAdd = function() {
    const div = L.DomUtil.create('div', 'map-legend');
    div.innerHTML =
      '<span class="map-legend-circle" style="opacity:0.9"></span><span>5 min (400 m)</span>' +
      '<br><span class="map-legend-circle" style="opacity:0.55"></span><span>10 min (800 m)</span>' +
      '<br><span class="map-legend-circle" style="opacity:0.35"></span><span>15 min (1.2 km)</span>';
    return div;
  };
  legend.addTo(map);

  const activePois    = new Set(RAW_GEOJSON.features.map(f => f.id));
  const secondaryPois = new Set(RAW_GEOJSON.features.filter(f => f.properties.status === 'secondary').map(f => f.id));
  const markerMap  = {};
  const layerByCat = {};
  let selectedCatFilter = null;
  let showSecondary = true;

  const PALETTE = [
    '#16a34a','#2563eb','#f97316','#9333ea','#dc2626',
    '#0891b2','#ca8a04','#be185d','#15803d','#1d4ed8',
    '#ea580c','#7c3aed','#b91c1c','#0e7490',
  ];
  const catColors = {};
  const catMeta   = RAW_GEOJSON._meta?.category_meta || {};
  Object.entries(catMeta).forEach(([label, m], i) => {
    catColors[label] = m.color || PALETTE[i % PALETTE.length];
  });

  function makeIcon(poi) {
    const color = catColors[poi.properties.category] || '#6b7280';
    const secondary = secondaryPois.has(poi.id);
    const size = secondary ? 20 : 28;
    const fs   = secondary ? 10 : 14;
    const border = secondary ? '#ccc' : 'white';
    const opacity = secondary ? '0.55' : '1';
    return L.divIcon({
      html: '<div class="map-pin" style="background:' + color + ';width:' + size + 'px;height:' + size + 'px;font-size:' + fs + 'px;border-color:' + border + ';opacity:' + opacity + '">' + (poi.properties.icon || '📍') + '</div>',
      className: '',
      iconSize: [size, size],
      iconAnchor: [size / 2, size / 2],
    });
  }

  function popupHtml(feature) {
    const props = feature.properties;
    const id = feature.id;
    const isSec = secondaryPois.has(id);
    let h = '<strong>' + props.name + '</strong><br>';
    h += '<span class="popup-cat">' + (props.icon || '') + ' ' + props.category + '</span>';
    if (props.rating) h += '<br>⭐ ' + props.rating.toFixed(1);
    if (props.opening_hours?.raw) h += '<br>🕐 ' + props.opening_hours.raw;
    if (props.phone) h += '<br>📞 ' + props.phone;
    if (props.website) h += '<br><a href="' + props.website + '" target="_blank" rel="noopener">🔗 Website</a>';
    if (!READONLY) {
      h += '<div class="popup-actions">';
      h += '<button class="popup-action-btn popup-status-btn" onclick="window.toggleSecondaryFromPopup(\'' + id + '\')" title="' + (isSec ? 'Promote to primary' : 'Demote to secondary') + '">'
         + (isSec ? '○ Secondary' : '● Primary') + '</button>';
      h += '<button class="popup-action-btn popup-remove-btn" onclick="window.removePoi(\'' + id + '\');window._wizardMap?.closePopup();" title="Remove from map">✕ Remove</button>';
      h += '</div>';
    }
    return h;
  }

  RAW_GEOJSON.features.forEach(feature => {
    if (READONLY && secondaryPois.has(feature.id)) return;
    const [lon, lat] = feature.geometry.coordinates;
    const marker = L.marker([lat, lon], { icon: makeIcon(feature) })
      .bindPopup(popupHtml(feature));
    if (!layerByCat[feature.properties.category]) {
      layerByCat[feature.properties.category] = L.layerGroup().addTo(map);
    }
    layerByCat[feature.properties.category].addLayer(marker);
    markerMap[feature.id] = marker;
  });

  function _metaHtml(props) {
    const lines = [];
    if (props.opening_hours?.raw) lines.push('🕐 ' + props.opening_hours.raw);
    if (props.rating) {
      let r = '⭐ ' + props.rating.toFixed(1);
      if (props.user_rating_count) r += ' (' + props.user_rating_count + ' reviews)';
      lines.push(r);
    }
    if (props.price_level) lines.push(props.price_level);
    if (props.phone) lines.push('📞 <a href="tel:' + props.phone + '">' + props.phone + '</a>');
    if (props.website) lines.push('🔗 <a href="' + props.website + '" target="_blank" rel="noopener">Website ↗</a>');
    if (props.video_url) lines.push('<iframe src="' + props.video_url + '" width="100%" height="140" frameborder="0" allowfullscreen style="border-radius:4px;margin-top:0.2rem;display:block;"></iframe>');
    return lines.join('<br>');
  }

  window.renderPoiList = function() {
    const list = document.getElementById('poi-list');
    if (!list) return;
    const active = RAW_GEOJSON.features.filter(f =>
      activePois.has(f.id) &&
      (READONLY ? !secondaryPois.has(f.id) : true) &&
      (selectedCatFilter === null || f.properties.category === selectedCatFilter)
    );
    list.innerHTML = '';
    const byCat = {};
    active.forEach(f => {
      const cat = f.properties.category;
      if (!byCat[cat]) byCat[cat] = [];
      byCat[cat].push(f);
    });
    Object.entries(byCat).forEach(([cat, pois]) => {
      const group = document.createElement('div');
      group.className = 'poi-group';
      group.innerHTML = '<div class="poi-group-header">' + (catMeta[cat]?.icon || '') + ' ' + cat + '</div>';
      pois.forEach(f => {
        const row = document.createElement('div');
        const isSec = secondaryPois.has(f.id);
        row.className = 'poi-row' + (isSec ? ' poi-secondary' : '');
        row.dataset.id = f.id;
        const color = catColors[f.properties.category] || '#6b7280';
        const meta = _metaHtml(f.properties);
        const hasMeta = meta.length > 0;
        row.innerHTML =
          '<div class="poi-row-summary">' +
          '<span class="poi-dot" style="background:' + color + '"></span>' +
          (READONLY ? '' : '<button type="button" class="poi-status-btn" title="' + (isSec ? 'Promote to primary' : 'Demote to secondary') + '" onclick="toggleSecondary(\'' + f.id + '\')">' + (isSec ? '○' : '●') + '</button>') +
          '<span class="poi-name poi-name-link" onclick="highlightPoi(\'' + f.id + '\')">' + f.properties.name + '</span>' +
          (READONLY ? '' : '<button type="button" class="poi-remove-btn" title="Remove from map" onclick="removePoi(\'' + f.id + '\')">✕</button>') +
          (hasMeta ? '<button type="button" class="poi-meta-btn" data-id="' + f.id + '" onclick="togglePoiMeta(\'' + f.id + '\')"><i class="fa-solid fa-angle-down"></i></button>' : '') +
          '</div>' +
          (hasMeta ? '<div class="poi-meta-panel" data-id="' + f.id + '" hidden>' + meta + '</div>' : '');
        group.appendChild(row);
      });
      list.appendChild(group);
    });
    updatePoiCount();
    updateCatCounts();
  };

  function updatePoiCount() {
    const el = document.getElementById('poi-count');
    if (el) el.textContent = activePois.size;
  }

  function updateCatCounts() {
    document.querySelectorAll('.cat-checkbox').forEach(cb => {
      const cat   = cb.dataset.cat;
      const count = RAW_GEOJSON.features.filter(f => activePois.has(f.id) && f.properties.category === cat).length;
      const badge = cb.closest('.category-toggle-row')?.querySelector('.cat-count');
      if (badge) badge.textContent = count;
    });
  }

  window.highlightPoi = function(id) {
    const f = RAW_GEOJSON.features.find(x => x.id === id);
    const marker = markerMap[id];
    if (!f || !marker) return;
    const [lon, lat] = f.geometry.coordinates;
    map.flyTo([lat, lon], Math.max(map.getZoom(), 17), { duration: 0.6 });
    marker.openPopup();
  };

  window.togglePoiMeta = function(id) {
    const panel = document.querySelector('.poi-meta-panel[data-id="' + id + '"]');
    if (!panel) return;
    const open = panel.hidden;
    panel.hidden = !open;
    const btn = document.querySelector('.poi-meta-btn[data-id="' + id + '"]');
    if (btn) btn.innerHTML = open ? '<i class="fa-solid fa-angle-up"></i>' : '<i class="fa-solid fa-angle-down"></i>';
  };

  function _doToggleSecondary(id) {
    const f = RAW_GEOJSON.features.find(x => x.id === id);
    if (!f) return;
    if (typeof gtag !== 'undefined') gtag('event', 'poi_toggled_secondary', {category: f.properties.category, to_secondary: !secondaryPois.has(id)});
    if (secondaryPois.has(id)) secondaryPois.delete(id);
    else secondaryPois.add(id);
    const oldMarker = markerMap[id];
    if (oldMarker) {
      const [lon, lat] = f.geometry.coordinates;
      const newMarker = L.marker([lat, lon], { icon: makeIcon(f) }).bindPopup(popupHtml(f));
      if (layerByCat[f.properties.category]) {
        layerByCat[f.properties.category].removeLayer(oldMarker);
        if (showSecondary || !secondaryPois.has(id)) {
          layerByCat[f.properties.category].addLayer(newMarker);
        }
      }
      markerMap[id] = newMarker;
    }
    const row = document.querySelector('.poi-row[data-id="' + id + '"]');
    if (row) {
      const isSec = secondaryPois.has(id);
      row.className = 'poi-row' + (isSec ? ' poi-secondary' : '');
      const btn = row.querySelector('.poi-status-btn');
      if (btn) { btn.textContent = isSec ? '○' : '●'; btn.title = isSec ? 'Promote to primary' : 'Demote to secondary'; }
    }
  }

  window.toggleSecondary = _doToggleSecondary;

  window.toggleSecondaryFromPopup = function(id) {
    _doToggleSecondary(id);
    const marker = markerMap[id];
    if (marker) marker.openPopup();
  };

  window.removePoi = function(id) {
    activePois.delete(id);
    secondaryPois.delete(id);
    const f = RAW_GEOJSON.features.find(x => x.id === id);
    const marker = markerMap[id];
    if (marker && f && layerByCat[f.properties.category]) {
      layerByCat[f.properties.category].removeLayer(marker);
    }
    const row = document.querySelector('.poi-row[data-id="' + id + '"]');
    if (row) row.remove();
    updatePoiCount();
    updateCatCounts();
  };

  function updateMarkerOpacity() {
    homeMarker.setOpacity(1);
    RAW_GEOJSON.features.forEach(f => {
      const marker = markerMap[f.id];
      if (!marker) return;
      const sec = secondaryPois.has(f.id);
      const dim = selectedCatFilter !== null && f.properties.category !== selectedCatFilter;
      marker.setOpacity(dim ? (sec ? 0.3 : 0.5) : (sec ? 0.55 : 1));
    });
  }

  window.segregateEmptyCategories = function() {
    const togglesDiv = document.getElementById('category-toggles');
    if (!togglesDiv) return;
    const emptyRows = [];
    togglesDiv.querySelectorAll('.category-toggle-row').forEach(row => {
      if (!layerByCat[row.dataset.cat]) emptyRows.push(row);
    });
    if (!emptyRows.length) return;
    emptyRows.forEach(row => {
      row.remove();
      const cb = row.querySelector('.cat-checkbox');
      if (cb) { cb.disabled = true; cb.checked = false; }
      const badge = row.querySelector('.cat-count');
      if (badge) badge.textContent = '0';
      row.classList.add('cat-row-not-found');
    });
    const header = document.createElement('div');
    header.className = 'not-found-header';
    header.textContent = 'Not found nearby';
    const grid = document.createElement('div');
    grid.className = 'category-toggles category-toggles-not-found';
    emptyRows.forEach(row => grid.appendChild(row));
    togglesDiv.insertAdjacentElement('afterend', grid);
    togglesDiv.insertAdjacentElement('afterend', header);
  };

  document.addEventListener('change', function(e) {
    if (e.target.classList.contains('cat-checkbox')) {
      selectedCatFilter = null;
      document.querySelectorAll('.category-toggle-row').forEach(r => r.classList.remove('cat-filter-active'));
      updateMarkerOpacity();
      const cat   = e.target.dataset.cat;
      const layer = layerByCat[cat];
      if (e.target.checked) {
        if (layer) map.addLayer(layer);
        RAW_GEOJSON.features.filter(f => f.properties.category === cat && markerMap[f.id])
          .forEach(f => activePois.add(f.id));
      } else {
        if (layer) map.removeLayer(layer);
        RAW_GEOJSON.features.filter(f => f.properties.category === cat)
          .forEach(f => activePois.delete(f.id));
      }
      window.renderPoiList();
    }
    if (e.target.id === 'show-secondary') {
      showSecondary = e.target.checked;
      RAW_GEOJSON.features.forEach(f => {
        if (!secondaryPois.has(f.id) || !activePois.has(f.id)) return;
        const marker = markerMap[f.id];
        const layer  = layerByCat[f.properties.category];
        if (!marker || !layer) return;
        if (showSecondary) layer.addLayer(marker);
        else layer.removeLayer(marker);
      });
    }
  });

  document.addEventListener('click', function(e) {
    if (e.target.classList.contains('cat-label')) {
      e.preventDefault();
      e.stopPropagation();
      const cat = e.target.closest('.category-toggle-row')?.dataset.cat;
      if (!cat || !layerByCat[cat]) return;
      selectedCatFilter = (selectedCatFilter === cat) ? null : cat;
      document.querySelectorAll('.category-toggle-row').forEach(r =>
        r.classList.toggle('cat-filter-active', r.dataset.cat === selectedCatFilter));
      updateMarkerOpacity();
      window.renderPoiList();
    }
    if (e.target.id === 'btn-select-all') {
      document.querySelectorAll('.cat-checkbox:not(:disabled)').forEach(cb => {
        if (!cb.checked) { cb.checked = true; cb.dispatchEvent(new Event('change', { bubbles: true })); }
      });
    }
    if (e.target.id === 'btn-select-none') {
      document.querySelectorAll('.cat-checkbox:not(:disabled)').forEach(cb => {
        if (cb.checked) { cb.checked = false; cb.dispatchEvent(new Event('change', { bubbles: true })); }
      });
    }
  });

  window.downloadGeoJSON = function() {
    if (typeof gtag !== 'undefined') gtag('event', 'geojson_downloaded', {poi_count: activePois.size});
    const active = {
      ...RAW_GEOJSON,
      features: RAW_GEOJSON.features
        .filter(f => activePois.has(f.id))
        .map(f => ({ ...f, properties: { ...f.properties, status: secondaryPois.has(f.id) ? 'secondary' : 'primary' } })),
    };
    const blob = new Blob([JSON.stringify(active, null, 2)], { type: 'application/geo+json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = 'airbnb-{{ listing_id }}-locations.geojson';
    a.click();
    URL.revokeObjectURL(url);
  };

  setTimeout(function() {
    window.segregateEmptyCategories();
    window.renderPoiList();
  }, 50);
})();
</script>
