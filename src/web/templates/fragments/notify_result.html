{% if error %}
<div class="alert alert-error" style="margin-bottom:0.75rem;">{{ error }}</div>
{% else %}
<div class="alert alert-success" style="margin-bottom:0.75rem;">
  <i class="fa-solid fa-check"></i> Got it! We'll email <strong>{{ email }}</strong> when your map goes live.
</div>
{% endif %}
<button class="btn btn-outline" type="button" onclick="closePublishModal()" style="width:100%;">
  {% if error %}Try again{% else %}Close{% endif %}
</button>
