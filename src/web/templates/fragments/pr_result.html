<div class="card">
  <h3>🗺 Publish the map online</h3>
  {% if error %}
  <div class="alert alert-error">{{ error }}</div>
  {% else %}
  <div class="alert alert-success">
    Your map has been submitted! ✓
  </div>
  <p style="margin-top:0.75rem; font-size:0.95rem;">
    We'll review it and publish it at <strong>maps.girard-davila.com</strong>.<br>
    You'll get an email at <strong>{{ email }}</strong> as soon as it's live — this usually takes a day or two.
  </p>
  {% endif %}
  <script>
  if (typeof gtag !== 'undefined') {
    {% if error %}
    gtag('event', 'pr_created_error');
    {% else %}
    gtag('event', 'pr_created_success');
    {% endif %}
  }
  </script>
</div>
